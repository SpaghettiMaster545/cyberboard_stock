name: Deploy To Oracle

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-oracle.yml'
      - 'config.json'
      - 'package.json'
      - 'src/**'
      - 'scripts/**'
      - 'deploy/oracle/**'

permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Validate secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
          ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "ORACLE_SSH_PORT=${ORACLE_SSH_PORT:-22}" >> "$GITHUB_ENV"
          if [ -n "${ORACLE_APP_DIR:-}" ]; then
            echo "ORACLE_APP_DIR=${ORACLE_APP_DIR}" >> "$GITHUB_ENV"
          else
            echo "ORACLE_APP_DIR=/home/${ORACLE_USER}/angrymiao-stock-bot" >> "$GITHUB_ENV"
          fi

      - name: Prepare SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -p "$ORACLE_SSH_PORT" -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Upload app bundle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          cat > .deploy.env <<EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          EOF
          ssh -i ~/.ssh/oracle_key -p "$ORACLE_SSH_PORT" "$ORACLE_USER@$ORACLE_HOST" "mkdir -p '$ORACLE_APP_DIR'"
          tar czf - package.json config.json src scripts deploy/oracle |
            ssh -i ~/.ssh/oracle_key -p "$ORACLE_SSH_PORT" "$ORACLE_USER@$ORACLE_HOST" "tar xzf - -C '$ORACLE_APP_DIR'"
          scp -i ~/.ssh/oracle_key -P "$ORACLE_SSH_PORT" .deploy.env "$ORACLE_USER@$ORACLE_HOST:$ORACLE_APP_DIR/.env"
          rm -f .deploy.env

      - name: Install and restart service
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -p "$ORACLE_SSH_PORT" "$ORACLE_USER@$ORACLE_HOST" \
            "cd '$ORACLE_APP_DIR' && chmod +x deploy/oracle/install.sh && APP_DIR='$ORACLE_APP_DIR' DEPLOY_USER='$ORACLE_USER' SERVICE_NAME='angrymiao-stock-bot' bash deploy/oracle/install.sh"

      - name: Smoke test on the server
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          # One pass over every watched store + a Telegram getMe, without touching saved state.
          ssh -i ~/.ssh/oracle_key -p "$ORACLE_SSH_PORT" "$ORACLE_USER@$ORACLE_HOST" \
            "cd '$ORACLE_APP_DIR' && node --version && timeout 120 node src/index.js --self-test"

      - name: Verify the service is up
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -p "$ORACLE_SSH_PORT" "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          unit=angrymiao-stock-bot
          since="$(systemctl show "$unit" -p ActiveEnterTimestamp --value)"
          logs() { sudo journalctl -u "$unit" --since "$since" --no-pager -o cat; }
          # Wait (up to ~60s) for the Telegram bot and the first successful stock check.
          for i in $(seq 1 30); do
            out="$(logs)"
            if grep -q 'ready - listening for commands' <<<"$out" && grep -q '\] ok: ' <<<"$out"; then break; fi
            sleep 2
          done
          sleep 10
          out="$(logs)"
          systemctl is-active --quiet "$unit" || { echo "::error::service is not running"; exit 1; }
          echo "Service active since: $since (restarts: $(systemctl show "$unit" -p NRestarts --value))"
          grep -q 'ready - listening for commands' <<<"$out" || { echo "::error::Telegram bot did not report ready"; exit 1; }
          grep -q '\] ok: ' <<<"$out" || { echo "::error::no successful stock check since the restart"; exit 1; }
          echo "Telegram bot connected and stock checks are succeeding."
          EOF

      - name: Show recent logs
        if: ${{ always() }}
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/oracle_key -p "$ORACLE_SSH_PORT" "$ORACLE_USER@$ORACLE_HOST" \
            "sudo journalctl -u angrymiao-stock-bot -n 60 --no-pager || true"