name: Stock Check

on:
  schedule:
    # Every 5 minutes. GitHub may delay or batch scheduled runs under load,
    # so real-world spacing is often 5-15 minutes. That is normal on the free tier.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never run two checks at the same time (avoids state-file push conflicts).
concurrency:
  group: stock-check
  cancel-in-progress: false

permissions:
  contents: write # required to commit the saved state back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js --once

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json data/heartbeat 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update stock state [skip ci]"
            git push
          else
            # Keepalive: public-repo scheduled workflows are auto-disabled after
            # 60 days without repo activity. If nothing changed for a while, make
            # a tiny heartbeat commit so the schedule keeps running.
            LAST=$(git log -1 --format=%ct)
            NOW=$(date +%s)
            DAYS=$(( (NOW - LAST) / 86400 ))
            if [ "$DAYS" -ge 20 ]; then
              date -u +"%Y-%m-%dT%H:%M:%SZ" > data/heartbeat
              git add -f data/heartbeat
              git commit -m "chore: keepalive [skip ci]"
              git push
            else
              echo "No stock changes. Last commit ${DAYS} day(s) ago."
            fi
          fi
